<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- PURE KREMÓWKA CAKE (Bez cienia, bez poświaty, idealnie wyśrodkowana) -->

  <!-- Bottom Pastry Crust Base -->
  <g id="bottom-crust">
    <!-- Base front & side -->
    <path d="M45 140 L120 170 L195 140 L195 152 L120 183 L45 152 Z" fill="#C4781B" stroke="#000E56" stroke-width="3" stroke-linejoin="round" />
    <!-- Flaky texture lines on base -->
    <path d="M68 151 L98 162 M142 163 L175 150" stroke="#8E4E02" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Massive Custard Cream Layer (Krem budyniowy / waniliowy) -->
  <g id="cream-layer">
    <!-- Cream left side (light) -->
    <path d="M45 94 L120 126 L120 170 L45 140 Z" fill="#FFEA9F" stroke="#000E56" stroke-width="3" stroke-linejoin="round" />
    <!-- Cream right side (shadow) -->
    <path d="M120 126 L195 94 L195 140 L120 170 Z" fill="#FFDF73" stroke="#000E56" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Cream Swirls & Waves -->
    <!-- Left side highlights/waves -->
    <path d="M56 110 Q84 120 110 131" stroke="#FFF7D1" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M58 126 Q85 135 110 147" stroke="#F6D058" stroke-width="2.5" stroke-linecap="round" fill="none" />
    
    <!-- Right side shadow waves -->
    <path d="M130 133 Q158 120 184 108" stroke="#F6D058" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M130 149 Q158 136 184 124" stroke="#E5B932" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Vanilla bean specks -->
    <circle cx="78" cy="116" r="1.3" fill="#7C4A15" opacity="0.6" />
    <circle cx="96" cy="134" r="1.3" fill="#7C4A15" opacity="0.6" />
    <circle cx="68" cy="128" r="1.3" fill="#7C4A15" opacity="0.6" />
    <circle cx="146" cy="123" r="1.3" fill="#7C4A15" opacity="0.6" />
    <circle cx="168" cy="114" r="1.3" fill="#7C4A15" opacity="0.6" />
    <circle cx="152" cy="144" r="1.3" fill="#7C4A15" opacity="0.6" />
    <circle cx="178" cy="132" r="1.3" fill="#7C4A15" opacity="0.6" />
  </g>

  <!-- Top Puff Pastry (Ciasto francuskie) -->
  <g id="top-crust">
    <!-- Top pastry edge front/sides -->
    <path d="M42 89 L120 121 L198 89 L198 99 L120 131 L42 99 Z" fill="#C4781B" stroke="#000E56" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Top puff pastry surface -->
    <path d="M42 89 L120 58 L198 89 L120 121 Z" fill="#E59838" stroke="#000E56" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Flaky crispy pastry facets / blisters -->
    <path d="M64 87 L104 72 L126 83 L86 98 Z" fill="#F6BA55" opacity="0.85" />
    <path d="M126 83 L164 69 L183 85 L145 99 Z" fill="#D38520" opacity="0.75" />
    <path d="M88 103 L120 89 L148 102 L115 117 Z" fill="#FAD17D" opacity="0.9" />

    <!-- Flaky crust crack lines -->
    <path d="M72 88 Q94 77 116 85" stroke="#9E5806" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <path d="M126 85 Q148 94 170 83" stroke="#9E5806" stroke-width="1.8" stroke-linecap="round" fill="none" />
  </g>

  <!-- Generous Layer of Powdered Sugar (Cukier Puder) on top -->
  <g id="powdered-sugar">
    <!-- Sugar patches -->
    <ellipse cx="120" cy="90" rx="60" ry="22" fill="#FFFFFF" fill-opacity="0.9" />
    <path d="M66 92 Q82 83 104 89 Q126 78 153 88 Q174 85 181 90 Q154 104 120 112 Q83 104 66 92 Z" fill="#FFFFFF" />
    
    <!-- Dusted sugar dots / powdery drift -->
    <circle cx="56" cy="94" r="2.5" fill="#FFFFFF" />
    <circle cx="78" cy="80" r="2.2" fill="#FFFFFF" />
    <circle cx="108" cy="73" r="3" fill="#FFFFFF" />
    <circle cx="138" cy="75" r="2.5" fill="#FFFFFF" />
    <circle cx="164" cy="82" r="2" fill="#FFFFFF" />
    <circle cx="184" cy="91" r="2.2" fill="#FFFFFF" />
    <circle cx="120" cy="101" r="3" fill="#FFFFFF" />
    <circle cx="95" cy="99" r="2.5" fill="#FFFFFF" />
    <circle cx="145" cy="97" r="2.2" fill="#FFFFFF" />
    <circle cx="120" cy="84" r="2.5" fill="#FFFFFF" />
    
    <!-- Sugar highlights -->
    <path d="M98 82 L100 87 L105 89 L100 91 L98 96 L96 91 L91 89 L96 87 Z" fill="#FFFFFF" />
    <path d="M145 83 L146.5 87 L150.5 88.5 L146.5 90 L145 94 L143.5 90 L139.5 88.5 L143.5 87 Z" fill="#FFFFFF" />
    <path d="M120 72 L121.5 76 L125.5 77.5 L121.5 79 L120 83 L118.5 79 L114.5 77.5 L118.5 76 Z" fill="#FFFFFF" />
  </g>
</svg>