services:
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.28.0
    user: "${CLOUD_SQL_PROXY_UID:-1000}:${CLOUD_SQL_PROXY_GID:-1000}"
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "--credentials-file=/credentials/adc.json"
      - "encoded-breaker-515313-h9:us-east1:shark-finance-db"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - type: bind
        source: "${CLOUD_SQL_CREDENTIALS_FILE:?Ustaw CLOUD_SQL_CREDENTIALS_FILE w backend/.env}"
        target: /credentials/adc.json
        read_only: true
        bind:
          create_host_path: false
